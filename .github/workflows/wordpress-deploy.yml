name: WordPress No-Code CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  source:
    name: 1. Source
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Validar estructura del proyecto
        run: |
          test -d wp-content
          echo "Repositorio descargado correctamente"

  build:
    name: 2. Build
    runs-on: ubuntu-latest
    needs: source

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura WordPress
        run: |
          test -d wp-content
          echo "Estructura WordPress válida"

      - name: Verificar plugins requeridos
        run: |
          test -d wp-content/plugins/elementor
          test -d wp-content/plugins/ameliabooking
          test -d wp-content/plugins/advanced-custom-fields
          echo "Plugins verificados"

  test:
    name: 3. Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis PHP
        run: |
          find . -name "*.php" -exec php -l {} \;

      - name: Generar reporte de validación
        run: |
          echo "Validación completada correctamente" > reporte.txt

      - name: Publicar reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-validacion
          path: reporte.txt

  release:
    name: 4. Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Crear paquete release
        run: |
          zip -r wordpress-release.zip . \
          -x ".git/*" \
          -x ".github/*"

      - name: Guardar release
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-release
          path: wordpress-release.zip

  deploy:
    name: 5. Deploy (Solo Tema Bloom Space)
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Desplegar solo el tema activo por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21

          # 🚀 Despliegue de alto rendimiento: Enfocado solo en tu tema
          local-dir: ./wp-content/themes/bloom-space/
          server-dir: ./wp-content/themes/bloom-space/

          # 🔒 estabilidad
          timeout: 60000
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**

  operate:
    name: 6. Operate
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verificar disponibilidad
        run: |
          # Se añade User-Agent para simular un navegador real y evitar bloqueos (Error 415)
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -I fenixestrategiadigital.com

      - name: Verificar código HTTP
        run: |
          STATUS=$(curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -L -o /dev/null -s -w "%{http_code}" fenixestrategiadigital.com)
          echo "HTTP Status: $STATUS"

          # Validación flexible: Se aceptan códigos 200 (OK) y 301/302 (Redirecciones de WordPress)
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 301 ] && [ "$STATUS" -ne 302 ]; then
            echo "Error: Código HTTP no esperado ($STATUS)"
            exit 1
          fi

  monitor:
    name: 7. Monitor
    runs-on: ubuntu-latest
    needs: operate

    steps:
      - name: Medir tiempo de respuesta
        run: |
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -L -o /dev/null -s -w "Tiempo de respuesta: %{time_total}s\n" fenixestrategiadigital.com

      - name: Verificar certificado SSL
        run: |
          echo | openssl s_client -connect fenixestrategiadigital.com:443 -servername fenixestrategiadigital.com 2>/dev/null | openssl x509 -noout -dates

      - name: Finalizar monitoreo
        run: |
          echo "Pipeline ejecutado correctamente"
